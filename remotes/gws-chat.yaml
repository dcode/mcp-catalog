# Google Chat - Google's official Workspace MCP server (Developer Preview).
# Display name must NOT equal any name in the upstream default catalog: the entry
# object ID is a hash of the catalog name and the sanitized display name.
#
# serverUserType intentionally omitted: it is not a field in Obot v0.28.2 (ignored,
# and removed by `obot mcp convert-catalog`). Effective behavior is multiUser: a
# fixedURL remote with no user config is shared through a vMCP, and each user signs
# in to Google with their own OAuth token. Do not set forceSingleUser on vMCP components.
name: Google Chat (Google Workspace)
entryKey: gws-chat
shortDescription: Search and read Google Chat spaces, DMs, and messages, and send messages with Google's official Workspace MCP server
description: |
  Find Google Chat spaces, direct messages, and group chats; read and search message history across every conversation you belong to; and send Markdown-formatted messages (with optional citations and cards) to spaces and threads, all as your own Google account.

  See Google's [Chat MCP server reference](https://developers.google.com/workspace/chat/api/reference/mcp), [Configure the Chat MCP server](https://developers.google.com/workspace/chat/api/guides/configure-mcp-server), and [Configure the Google Workspace MCP servers](https://developers.google.com/workspace/guides/configure-mcp-servers) for setup, authentication, and current capabilities.

  ## What you'll need to connect

  1. **Shared OAuth client (Obot administrator).** Your Obot administrator configures this entry with the shared Google Cloud **Web application** OAuth client used for all Google Workspace MCP entries, with `https://<your-obot-host>/oauth/mcp/callback` as an authorized redirect URI. Google's Workspace MCP servers do not support dynamic client registration, so this static client is required.
  2. **Google Workspace Developer Preview.** The Google Cloud project that owns the OAuth client must be enrolled in the [Google Workspace Developer Preview Program](https://developers.google.com/workspace/preview).
  3. **APIs and MCP services enabled** in that project:
     - Google Chat API (`chat.googleapis.com`)
     - Chat MCP API (`chatmcp.googleapis.com`)
  4. **A configured Chat app** in the same project (Google Chat API > Manage > Configuration, with interactive features turned off) for write operations such as sending messages. Read-only use does not require it.
  5. **OAuth scopes** allowed on the project's OAuth consent screen (Data Access). Google's documented Chat MCP scopes are:
     - `https://www.googleapis.com/auth/chat.spaces.readonly`
     - `https://www.googleapis.com/auth/chat.memberships.readonly`
     - `https://www.googleapis.com/auth/chat.messages.readonly`
     - `https://www.googleapis.com/auth/chat.messages.create`
     - `https://www.googleapis.com/auth/chat.users.readstate`
     - `https://www.googleapis.com/auth/chat.users.spacesettings`

     Obot requests the scopes the server advertises in its protected-resource metadata, which also include `chat.spaces`, `chat.memberships`, `chat.messages`, and `chat.users.readstate.readonly`, so allow those too (or use an **Internal** Workspace app to avoid verification).
  6. **Sign in with your own Google account.** When you connect, Google asks you to authorize Obot. Every tool call runs as your Google identity with the scopes you grant; you only see conversations you are a member of.

  ## Notes

  - Google's Workspace MCP servers are in **Developer Preview**; tool names, parameters, and behavior may change without notice.
  - Google's reference also lists `list_memberships`, `mark_as_read`, `mark_as_unread`, `get_notification_settings`, and `update_notification_settings`; they are not currently returned by the server's `tools/list` and so are not shown in the tool preview.
  - `send_message` posts as you and can notify other people. Review messages before allowing an agent to send them.
metadata:
  categories: Google Workspace,Productivity,Communication
icon: https://upload.wikimedia.org/wikipedia/commons/2/2d/Google_Chat_Logo_05.2026.svg # byte-identical copy at icons/gws-chat.svg
repoURL: https://developers.google.com/workspace/chat/api/reference/mcp
runtime: remote
remoteConfig:
  fixedURL: https://chatmcp.googleapis.com/mcp/v1
  staticOAuthRequired: true
# toolPreview generated from the unauthenticated tools/list at https://chatmcp.googleapis.com/mcp/v1 (2026-11-22).
toolPreview:
  - name: list_messages
    description: Retrieves messages from a specified Google Chat conversation (Space, direct message (DM) or group DM) in Markdown format. Allows filtering by thread, time range, and number of messages. Additionally, the next page of messages can be retrieved to allow for more context. Private messages (messages only visible to a single user) are filtered out.
    params:
      conversationId: 'Required. The ID of the conversation. A conversation can either be a space, direct message (DM) or group DM/Chat. Format: spaces/{space}'
      endTime: Optional. ISO 8601 timestamp to filter messages. Only messages created before this time will be returned.
      pageSize: Optional. The maximum number of messages to return. The service may return fewer than this value. If unspecified, defaults to 20. The maximum value is 50. If you use a value more than 50, it's automatically changed to 50.
      pageToken: Optional. A page token, received from a previous list_messages call. Provide this to retrieve the subsequent page.
      startTime: Optional. ISO 8601 timestamp to filter messages. Only messages created after this time will be returned.
      threadId: 'Optional. The ID of a specific thread within the conversation. If provided, only messages from this thread will be returned. If omitted, messages from all threads in the conversation are considered. Format: spaces/{space}/threads/{thread}'
  - name: search_messages
    description: Searches for Google Chat messages using keywords and filters returning them in Markdown format. Works across all spaces the user has access to, or can be scoped to a specific conversation.
    params:
      pageSize: Optional. The maximum number of results to return (max up to 100). If unspecified, at most 25 are returned.
      pageToken: Optional. A page token, received from a previous `search_messages` call. Provide this to retrieve the subsequent page.
      searchParameters: Required. The search parameters to use for the search.
  - name: search_conversations
    description: Searches for Google Chat conversations to find conversation IDs. Named spaces are found by display name (`space_name_query`). Direct messages (DMs) and group chats are found only by participant email addresses (`participants`).
    params:
      discoverableSpaces: Optional. Field in development. Do not use unless explicitly instructed. If true, searches named spaces in the caller's organization that are discoverable to the caller and that the caller has neither joined nor been invited to. `space_name_query` performs a directory search (or browses recently active discoverable spaces when empty).
      pageSize: Optional. The maximum number of spaces to return. The service may return fewer than this value. If unspecified, at most 20 spaces will be returned. The maximum value is 1000; values above 1000 will be coerced to 1000. When `discoverable_spaces` is set, values above 50 are coerced to 50.
      pageToken: Optional. A page token, received from a previous `search_conversations` call. Provide this to retrieve the subsequent page. When `discoverable_spaces` or `pending_invites` is set, keep `space_name_query`, `discoverable_spaces`, and `pending_invites` identical to the call that returned the token; those page tokens are bound to the search mode and query and are rejected in any other mode.
      participants: 'Optional. List of email addresses of the participants to filter the conversations, excluding the caller. Use this to find direct messages (DMs) and group chats: a single participant returns the 1:1 DM with that person, and multiple participants return group chats containing all of them. Named spaces are not returned when this field is set.'
      pendingInvites: Optional. Field in development. Do not use unless explicitly instructed. If true, lists the caller's pending invitations to named spaces and group chats, newest invitation first. Spam invitations are excluded and 1:1 direct message requests are not included. `space_name_query` filters the invitations by display name (case-insensitive substring match).
      spaceNameQuery: Optional. The text to search for within conversation display names (case-insensitive substring match). If `participants` is empty, only named spaces are searched and direct messages (DMs) and group chats are never returned, so searching for a person's name here won't find a DM with them. To find a DM or group chat, provide the members' email addresses in `participants` instead.
  - name: send_message
    description: Sends a Google Chat message to a conversation with Markdown formatting and optional citations.
    params:
      cards: Optional. Cards attached to the message. Maximum size is 32 KB per card. Each card is represented as a JSON struct following the Google Chat Card format (Google Workspace UIKit Card / Cards v2). To attach cards to a message, the Chat app must be a member of the space. Images in cards aren't supported.
      conversationId: Required. The ID of the conversation (e.g., 'spaces/AAAA...') to send the message to.
      footerCitedSources: Optional. Top-level cited sources displayed as reference cards at the bottom (footer) of the message. A maximum of 50 cited sources are allowed in total across all inline citations and footer sources in a message.
      inlineCitations: Optional. Inline citations referenced within `messageText` via `chat-citation` tags. A maximum of 20 inline citations are allowed per message. Unreferenced inline citations (those without a matching `chat-citation` tag in `messageText`) are ignored and do not cause a validation error.
      messageText: Required. The main content of the message. Formatting can be added using standard Markdown (note that tables are NOT supported).
      threadId: Optional. The ID of the thread (e.g., 'spaces/AAAA.../threads/BBBB...') to send the message to. If not set, the message will be sent to a new thread.
